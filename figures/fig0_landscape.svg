<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ================= Stage 1: Clinical sources ================= -->
  <g filter="url(#sh)">
    <rect x="20" y="40" width="300" height="500" rx="8" fill="#eef4fa" stroke="#1a4078" stroke-width="2"/>
  </g>
  <text x="170" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#1a4078">Clinical sources</text>
  <text x="170" y="100" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">the facts to be conveyed</text>
  <g font-size="14" fill="#1a1a2e">
    <text x="42" y="150">Structured records</text>
    <text x="42" y="192">Diagnostic labels</text>
    <text x="42" y="234">Symptom lists</text>
    <text x="42" y="276">Care plans</text>
    <text x="42" y="318">Clinical guidelines</text>
    <text x="42" y="360">Manual scenarios</text>
  </g>
  <text x="170" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">whatever the format</text>
  <text x="170" y="490" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">of the source</text>

  <!-- ================= Stage 2: LLM generation ================= -->
  <g filter="url(#sh)">
    <rect x="360" y="40" width="300" height="500" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
  </g>
  <text x="510" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a3a">LLM generation</text>
  <text x="510" y="100" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">controlled properties</text>
  <g font-size="14" fill="#1a1a2e">
    <text x="382" y="150">Speaker role</text>
    <text x="382" y="192">Intent</text>
    <text x="382" y="234">Uncertainty</text>
    <text x="382" y="276">Missingness</text>
    <text x="382" y="318">Style / register</text>
    <text x="382" y="360">Channel noise</text>
  </g>
  <text x="510" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">the source defines the facts;</text>
  <text x="510" y="490" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">the model realizes them in language</text>

  <!-- ================= Stage 3: Communication channels (the modality) ================= -->
  <g filter="url(#sh)">
    <rect x="700" y="40" width="300" height="500" rx="8" fill="#f4ecf7" stroke="#722f8a" stroke-width="3.2"/>
  </g>
  <text x="850" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#722f8a">Synthetic clinical</text>
  <text x="850" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#722f8a">communication</text>
  <g font-size="13" fill="#1a1a2e">
    <g><rect x="720" y="128" width="260" height="52" rx="6" fill="#fff" stroke="#722f8a" stroke-width="1.3"/><text x="850" y="159" text-anchor="middle">Patient&#8211;clinician dialogue</text></g>
    <g><rect x="720" y="196" width="260" height="52" rx="6" fill="#fff" stroke="#722f8a" stroke-width="1.3"/><text x="850" y="227" text-anchor="middle">Doctor-to-patient instructions</text></g>
    <g><rect x="720" y="264" width="260" height="52" rx="6" fill="#fff" stroke="#722f8a" stroke-width="1.3"/><text x="850" y="295" text-anchor="middle">Telemedicine &amp; portal messaging</text></g>
    <g><rect x="720" y="332" width="260" height="52" rx="6" fill="#fff" stroke="#722f8a" stroke-width="1.3"/><text x="850" y="363" text-anchor="middle">EMS &amp; emergency dispatch</text></g>
    <g><rect x="720" y="400" width="260" height="52" rx="6" fill="#fff" stroke="#722f8a" stroke-width="1.3"/><text x="850" y="431" text-anchor="middle">Nurse / SBAR handoff</text></g>
  </g>
  <text x="850" y="500" text-anchor="middle" font-size="12.5" font-style="italic" fill="#722f8a">the modality studied here</text>

  <!-- ================= Stage 4: Downstream model & tasks ================= -->
  <g filter="url(#sh)">
    <rect x="1040" y="40" width="300" height="500" rx="8" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="2"/>
  </g>
  <text x="1190" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a3a">Downstream NLP</text>
  <text x="1190" y="100" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">trained on synthetic data</text>
  <g font-size="14" fill="#1a1a2e">
    <text x="1062" y="146">Information extraction</text>
    <text x="1062" y="184">Triage &amp; routing</text>
    <text x="1062" y="222">Summarization</text>
    <text x="1062" y="260">Question answering</text>
    <text x="1062" y="298">Completeness checking</text>
    <text x="1062" y="336">Patient simulation</text>
  </g>
  <line x1="1062" y1="360" x2="1318" y2="360" stroke="#c9cdd2" stroke-width="1"/>
  <text x="1190" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Evaluated by regime</text>
  <text x="1190" y="470" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">held-out synthetic,</text>
  <text x="1190" y="490" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5a4a3a">or transfer to real text</text>

  <!-- ================= Pipeline arrows (left to right) ================= -->
  <g stroke="#1a1a2e" stroke-width="2.5" fill="none">
    <line x1="322" y1="290" x2="356" y2="290" marker-end="url(#arr)"/>
    <line x1="662" y1="290" x2="696" y2="290" marker-end="url(#arr)"/>
    <line x1="1002" y1="290" x2="1036" y2="290" marker-end="url(#arr)"/>
  </g>

  <!-- ================= Evaluation-regime bar (bottom) ================= -->
  <g filter="url(#sh)">
    <rect x="20" y="596" width="620" height="84" rx="8" fill="#fff5dc" stroke="#d4b96a" stroke-width="1.5"/>
  </g>
  <text x="46" y="626" font-size="15" font-weight="700" fill="#1a1a2e">S&#8594;S</text>
  <text x="46" y="648" font-size="12.5" fill="#5a4a3a">train and test on synthetic</text>
  <text x="46" y="668" font-size="12.5" font-weight="700" fill="#1f7a3a">most studies</text>
  <line x1="300" y1="638" x2="420" y2="638" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="470" y="626" font-size="15" font-weight="700" fill="#1a1a2e">S&#8594;R</text>
  <text x="470" y="648" font-size="12.5" fill="#5a4a3a">test on real communication</text>
  <text x="470" y="668" font-size="12.5" font-weight="700" fill="#b3401b">open frontier</text>

  <g filter="url(#sh)">
    <rect x="660" y="596" width="680" height="84" rx="8" fill="#fafbfc" stroke="#5a4a3a" stroke-width="1"/>
  </g>
  <text x="682" y="628" font-size="13.5" fill="#1a1a2e">No prior review organizes the field along this pipeline across</text>
  <text x="682" y="650" font-size="13.5" fill="#1a1a2e">all channels; the under-served EMS, dispatch, and handoff channels</text>
  <text x="682" y="672" font-size="13.5" fill="#1a1a2e">are where synthetic communication is most enabling.</text>
</svg>
